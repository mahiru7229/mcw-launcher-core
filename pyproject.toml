[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcw-core"
version = "1.5.0"
description = "Headless Minecraft runtime, instance, loader, modpack, repair, update, and launch core used by MCW Launcher"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mahiru7229"}]
dependencies = [
    "cryptography>=46,<47",
    "httpx[socks]>=0.28,<1",
    "requests>=2.32,<3",
    "keyring>=25,<26; sys_platform == 'linux'",
    "SecretStorage>=3.3,<4; sys_platform == 'linux'",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[project.scripts]
mcw-core-launch = "mcw_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcw_core*", "src", "src.core*", "src.models*"]
exclude = ["src.gui*", "test*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
"mcw_core.resources" = ["*.jar"]

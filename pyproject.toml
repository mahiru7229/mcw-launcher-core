[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcw-core"
version = "1.3.2"
description = "Headless Minecraft runtime, instance, loader, modpack, repair, and launch core used by MCW Launcher"
readme = "docs/MCW_CORE_LIBRARY.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "mahiru7229"}]
dependencies = [
    "httpx>=0.28,<1",
    "requests>=2.32,<3",
    "pywin32>=311; sys_platform == 'win32'",
]

[project.scripts]
mcw-core-launch = "mcw_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcw_core*", "src", "src.core*", "src.models*", "src.database*"]
exclude = ["src.gui*", "test*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
"mcw_core.resources" = ["*.jar"]
